plugin:
  name: custom-data-type-tnadiscovery
  version: 2.0
  url: https://github.com/programmfabrik/fylr-plugin-custom-data-type-tnadiscovery
  displayname:
    de-DE: tnadiscovery-Verknüpfung
    en-US: tnadiscovery-Referencing
  info:
    de-DE: |
      Ergänzt einen benutzerdefinierten Datentyp, mit dem sich fylr-Datensätze mit Archiveinträgen des Discovery-Systems der National Archives in London verknüpfen lassen. Bei der Eingabe schlägt das Feld passende Einträge aus der Discovery-API vor und übernimmt deren Referenzangaben für eine konsistente Normdatenführung.

      - Vorschläge während der Eingabe über die Discovery-API
      - Speichert bevorzugte Bezeichnung, Concept-URI sowie Discovery-ID/-URL
      - Erfasst Referenznummer, Aufbewahrungsort, Titel und Beschreibung

      Bindet das [Discovery-System der National Archives](http://discovery.nationalarchives.gov.uk/) an.
    en-US: |
      Adds a custom data type for linking fylr records to archival entities in the Discovery system of The National Archives, London. As you type, the field suggests matching entities from the Discovery API and pulls in their reference details for consistent authority control.

      - Type-ahead suggestions backed by the Discovery API
      - Stores the entity's preferred label, concept URI and Discovery ID/URL
      - Captures reference number, location held, title and description

      Integrates with the [National Archives Discovery system](http://discovery.nationalarchives.gov.uk/).
  l10n: l10n/customDataTypeTNADiscovery.csv
  webfrontend:
    url: customDataTypeTNADiscovery.js
    css: customDataTypeTNADiscovery.css
    dependencies:
      - commons-library

base_url_prefix: "webfrontend"

custom_types:
  tnadiscovery:
    mapping:
      conceptName:
        type: text
      conceptURI:
        type: text
        skipTerms: true
      discoveryURL:
        type: text
        skipTerms: true
      referenceNumber:
        type: text
      locationHeld:
        type: text
        skipTerms: true
      title:
        type: text
        skipTerms: true
      description:
        type: text
        skipTerms: true
      facetTerm:
        type: text_l10n
        skipTerms: true
    config:
      schema:
      mask:
        - name: editor_display
          parameters:
            value:
              type: select
              options: ["default", "condensed"]

    update:
      plugin_user:
        reference: system:root
      exec:
        service: "node"
        commands:
          - prog: "node"
            stdin:
              type: body
            stdout:
              type: body
            args:
              - type: "value"
                value: "%_exec.pluginDir%/updater/TNADiscoveryUpdater.js"
              - type: "value"
                value: "%info.json%"
      timeout: 60
      batch_size: 1
      expires_days: 1

base_config:
  - name: update_tnadiscovery
    group: update_custom_data_type
    parameters:
      restrict_time:
        type: bool
        default: false
        position: 0
      from_time:
        type: int
        default: 19
        min: 0
        max: 23
        position: 1
      to_time:
        type: int
        default: 4
        min: 0
        max: 23
        position: 2
      custom_expires_days:
        type: int
        min: 1
        default: 1
        position: 4
